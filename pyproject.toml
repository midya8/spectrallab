[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "spectrallab"
version = "0.2.0"
description = "Inspectable normalized graph clustering, eigenpair and cut witnesses"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "MIT"}
[tool.setuptools.packages.find]
include = ["spectrallab*"]
